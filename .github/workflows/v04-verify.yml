name: v0.4 verification

on:
  push:
    branches:
      - feature/v04-smart-dashboard
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check src/index.js
      - run: node --check src/lib.js
      - run: node --check src/db.js
      - run: node --check src/render.js
      - run: node --check src/publications.js
      - run: node --check src/notifications.js
      - run: node --check src/telegram.js
      - run: npm test
