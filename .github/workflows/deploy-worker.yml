name: Deploy water bot to Cloudflare
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inspection or deployment
        type: choice
        options: [inspect, deploy]
        default: inspect
      enable_schedule_card:
        description: Enable the card only for the verified Pokrovska publication
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: botvoda-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bot tests before publishing
        run: npm test
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions repository secrets before running this manual deployment."
            exit 1
          fi
      - name: Install Wrangler CLI
        run: npm install --no-audit --no-fund
      - name: Inspect production binding and publication without writes
        env:
          CARD_PREFLIGHT_OUTPUT: ${{ runner.temp }}/card-preflight.json
        run: node scripts/card-production-preflight.mjs
      - name: Deploy existing botvoda Worker
        if: inputs.mode == 'deploy' && !inputs.enable_schedule_card
        run: npm run deploy
      - name: Deploy and enable the card for the verified group
        if: inputs.mode == 'deploy' && inputs.enable_schedule_card
        shell: bash
        env:
          PREFLIGHT_FILE: ${{ runner.temp }}/card-preflight.json
        run: |
          set -euo pipefail
          card_chat_id=$(node -e 'const f=require("fs"); console.log(JSON.parse(f.readFileSync(process.env.PREFLIGHT_FILE)).target.group_chat_id)')
          if [[ ! "$card_chat_id" =~ ^-[0-9]+$ ]]; then
            echo "::error::Invalid verified group ID"
            exit 1
          fi
          npm run deploy -- --var SCHEDULE_CARD_ENABLED:on --var "SCHEDULE_CARD_CHAT_ID:$card_chat_id"
